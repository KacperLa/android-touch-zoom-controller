    versionCode: 33
    commit: 63919b63837bf1db4f70b8136ac931cc5d8d0715
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-alternatives --set java 
        /usr/lib/jvm/java-17-openjdk-amd64/bin/java
    gradle:
      - yes
    binary: 
      https://github.com/KacperLa/android-touch-zoom-controller/releases/download/v0.33-alpha.1/Touch-Zoom-0.33-signed.apk
    srclibs:
      - reproducible-apk-tools@v0.3.2
    prebuild:
      - mkdir -p ../gradle/wrapper
      - printf 
        'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip\n'
        > ../gradle/wrapper/gradle-wrapper.properties
      - sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
    postbuild:
      - python3 $$reproducible-apk-tools$$/zipalign.py --page-size 16 
        --pad-like-apksigner --replace $$OUT$$ aligned.apk
      - mv aligned.apk $$OUT$$

