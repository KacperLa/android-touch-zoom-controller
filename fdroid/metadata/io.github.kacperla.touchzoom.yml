AutoName: Touch Zoom
Summary: Control Android screen magnification with one finger
Description: |-
  A floating touch controller for Android's full-screen system magnifier.
  Zoom, pan and move the controller with one finger while the controller and
  its quick menu stay outside the magnified content.

  Configure tap actions, double-tap sliding, colors, idle opacity, touchpad
  size and hold delay. Requires Android 14 or newer and accessibility access
  to control magnification. It cannot read window content, capture screenshots
  or inject taps, and does not request internet access. No ads or analytics.

  This is early alpha software with limited device coverage. Only the default
  display and full-screen magnification are supported. Keyboard, folding-device,
  TalkBack and manufacturer-specific behavior need broader testing. Severe
  input delays have been observed with a Bluetooth mouse connected.

